[project]
name = "radar-cfm-mcp"
version = "0.1.0"
description = "Servidor MCP que consulta e monitora resoluções do CFM sobre IA, telemedicina e prontuário eletrônico"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "duckdb>=1.1",
    "apscheduler>=3.10",
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.scripts]
radar-cfm-mcp = "radar_cfm_mcp.mcp_server.server:main"
cfm-cli = "radar_cfm_mcp.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_cfm_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = [".tmp"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/radar_cfm_mcp/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "pdfplumber.*"]
ignore_missing_imports = true
